name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Avbryt eldre kjøringer på samme gren når nye pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — e2e + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install (workspaces)
        run: npm ci
      - name: Enhetstester (shareUtils, publicBase + loggmaskering)
        working-directory: apps/api
        run: node test/shareUtils.test.js && node test/publicBase.test.js
      - name: Verify Postgres 16 binaries
        run: ls -d /usr/lib/postgresql/*/bin | head -1
      - name: E2E — delingskjede mot ekte Postgres
        working-directory: apps/api
        run: bash test/e2e-share.sh
      - name: E2E — tenant-isolasjon (kryss-konto angrepstest)
        working-directory: apps/api
        run: bash test/e2e-tenant-isolation.sh
      - name: E2E — per-tester rate limiting
        working-directory: apps/api
        run: bash test/e2e-rate-limit.sh
      - name: E2E — sikkerhetsheadere, Host-allowliste, security.txt
        working-directory: apps/api
        run: bash test/e2e-headere.sh
      - name: npm audit (fail på høy+)
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM (CycloneDX, ikke-blokkerende)
        continue-on-error: true
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-file sbom.json
      - name: Last opp SBOM
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  mobile:
    name: App — typesjekk + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install (workspaces)
        run: npm ci
      - name: TypeScript
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Lint (ikke-blokkerende)
        continue-on-error: true
        working-directory: apps/mobile
        run: npm run lint
