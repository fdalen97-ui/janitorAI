name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Avbryt eldre kjøringer på samme gren når nye pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — e2e + audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install (workspaces)
        run: npm ci
      - name: Enhetstester (shareUtils, publicBase + loggmaskering)
        working-directory: apps/api
        run: node test/shareUtils.test.js && node test/publicBase.test.js
      - name: Verify Postgres 16 binaries
        run: ls -d /usr/lib/postgresql/*/bin | head -1
      - name: E2E — delingskjede mot ekte Postgres
        working-directory: apps/api
        run: bash test/e2e-share.sh
      - name: E2E — tenant-isolasjon (kryss-konto angrepstest)
        working-directory: apps/api
        run: bash test/e2e-tenant-isolation.sh
      - name: E2E — rapportgenerering mot stub-motor (S20 medie-URL, hovedbok)
        working-directory: apps/api
        run: bash test/e2e-rapport-motor.sh
      - name: E2E — per-tester rate limiting
        working-directory: apps/api
        run: bash test/e2e-rate-limit.sh
      - name: E2E — sikkerhetsheadere, Host-allowliste, security.txt
        working-directory: apps/api
        run: bash test/e2e-headere.sh
      - name: npm audit (fail på høy+)
        working-directory: apps/api
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM (CycloneDX, ikke-blokkerende)
        continue-on-error: true
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-file sbom.json
      - name: Last opp SBOM
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  engine:
    # Motoren hadde en syntaksfeil på main i en uke uten at noe sa fra (merge
    # 7e6ca83): e2e-rapport-motor.sh kjører mot en Node-stub, og enhetstestene
    # importerer ikke main.py. Denne jobben kompilerer alle moduler, lar pyflakes
    # finne navn som ikke er definert (udefinerte importer er like dødelige som
    # syntaksfeil), og kjører enhetstestene. Ingen nettverk, ingen tunge
    # avhengigheter: alt kjører på runnerens egen python3.
    name: AI-motor — kompilering, pyflakes, enhetstester
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Kompilerer alle moduler
        working-directory: ai-engine
        run: python3 -m py_compile *.py
      - name: pyflakes (udefinerte navn, ubrukte importer)
        working-directory: ai-engine
        run: python3 -m pip install --quiet --user pyflakes && python3 -m pyflakes *.py
      - name: Enhetstester (sitatport, idempotens, promptblokker, signaler)
        working-directory: ai-engine
        run: python3 -m unittest -v test_byggforsk_index test_idempotency test_prompt_blocks test_prompt_signals

  mobile:
    name: App — typesjekk + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install (workspaces)
        run: npm ci
      - name: TypeScript
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Lint (ikke-blokkerende)
        continue-on-error: true
        working-directory: apps/mobile
        run: npm run lint
